<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكاري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#14231f;--mute:#5d6f69;--line:#d9e0db;--g:#1f6b58;--gold:#a97a1e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fs:26px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1815;--card:#16241f;--ink:#e8efeb;--mute:#93a69f;--line:#26382f;--g:#5fc2a4;--gold:#e0b25a;--on:#0e1815}}
:root[data-theme="dark"]{--bg:#0e1815;--card:#16241f;--ink:#e8efeb;--mute:#93a69f;--line:#26382f;--g:#5fc2a4;--gold:#e0b25a;--on:#0e1815}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font:700 24px "Amiri",serif;color:var(--g);flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button.on{background:var(--g);color:var(--on);border-color:var(--g)}
main{max-width:640px;margin:0 auto;padding:14px}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{text-align:right;padding:12px;background:var(--card);border-radius:10px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.ch small{color:var(--mute)}.ch[disabled]{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px;color:var(--mute);font-weight:600}
.txt{font:400 var(--fs)/2 "Amiri",serif;margin:6px 0 10px}
.src{font-size:14px;color:var(--mute);margin:2px 0}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);margin-inline-start:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px}
nav button.on{background:none;color:var(--g);font-weight:600;box-shadow:inset 0 -3px var(--g)}
.big{font:700 88px/1 "Amiri",serif;text-align:center;margin:18px 0;color:var(--g)}
.tap{width:100%;padding:44px;font-size:22px;border-radius:16px;background:var(--g);color:var(--on)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
h2{font-size:18px;margin:18px 0 8px}
.hid{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips button{padding:4px 10px;font-size:14px}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>أذكاري</h1><button id="bs" aria-label="الإعدادات">الخط</button><button id="bt" aria-label="الوضع الليلي">الليل</button></header>
<main>
<div id="set" class="set hid"><div class="row"><label for="fs">حجم الخط</label><input id="fs" type="range" min="20" max="42" value="26"></div><div class="row"><button id="tk" class="on">التشكيل: يظهر</button></div></div>
<div id="v"></div>
</main>
<nav id="nv"><button data-t="h" class="on">الأبواب</button><button data-t="d">اليوم</button><button data-t="s">المسبحة</button><button data-t="f">قائمتي</button></nav>

const D=[
[1,0,"التسمية","«بِسْمِ اللهِ».","سنن أبي داود (101)، وجامع الترمذي (25)، وابن ماجه (397).","ورد حديث «لا وضوء لمن لم يذكر اسم الله عليه»، واختلف العلماء في ثبوته، وحسّنه بعضهم بمجموع طرقه.","h",1,"w"],
[2,0,"الشهادة بعد الوضوء","«أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ».","صحيح مسلم (234).","","h",1,"w"],
[3,0,"الدعاء بالتوبة والطهارة","«اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ».","جامع الترمذي (55).","وردت زيادةً في رواية الترمذي، وحسّنها عدد من أهل العلم.","h",1,"w"],
[4,0,"دعاء دخول الخلاء","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ».","صحيح البخاري (142)، وصحيح مسلم (375).","","h",1,""],
[5,0,"دعاء الخروج من الخلاء","«غُفْرَانَكَ».","سنن أبي داود (30)، وجامع الترمذي (7).","","h",1,""],
[6,1,"الاستفتاح الأول","«سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ».","سنن أبي داود (775)، والترمذي (243)، وابن ماجه (806).","","h",1,""],
[10,1,"الركوع","«سُبْحَانَ رَبِّيَ الْعَظِيمِ».","صحيح مسلم (772).","","h",3,""],
[17,1,"السجود","«سُبْحَانَ رَبِّيَ الْأَعْلَى».","صحيح مسلم (772).","","h",3,""],
[18,1,"دعاء السجود","«اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ».","صحيح مسلم (483).","","h",1,""],
[20,1,"الجلوس بين السجدتين","«رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي».","سنن أبي داود (874).","","h",1,""],
[27,1,"الاستغفار بعد الصلاة","«أَسْتَغْفِرُ اللهَ». ثلاث مرات.","صحيح مسلم (591).","","h",3,"p"],
[28,1,"دعاء السلام بعد الصلاة","«اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ».","صحيح مسلم (591).","","h",1,"p"],
[29,1,"التهليل بعد الصلاة","«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ».","صحيح مسلم (594).","","h",1,"p"],
[31,1,"التسبيح والتحميد والتكبير","سبحان الله: 33 مرة. الحمد لله: 33 مرة. الله أكبر: 33 مرة. ثم تمام المائة: «لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ».","صحيح مسلم (597).","","h",33,"p"],
[42,2,"دعاء دخول المسجد","«اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ».","صحيح مسلم (713).","","h",1,""],
[43,2,"دعاء الخروج من المسجد","«اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ».","صحيح مسلم (713).","","h",1,""],
[46,2,"الدعاء بعد الأذان","«اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ».","صحيح البخاري (614).","","h",1,""],
[48,3,"دعاء الخروج من المنزل","«بِسْمِ اللهِ، تَوَكَّلْتُ عَلَى اللهِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ».","سنن أبي داود (5095).","","h",1,"o"],
[55,4,"قبل الطعام","«بِسْمِ اللهِ».","صحيح البخاري (5376)، وصحيح مسلم (2022).","","h",1,"f"],
[57,4,"بعد الطعام","«الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ».","سنن أبي داود (4023)، والترمذي (3458).","","h",1,"f"],
[61,4,"دعاء الإفطار","«ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللهُ».","سنن أبي داود (2357)، وحسنه الألباني.","","h",1,"f"],
[81,7,"دعاء الهم والحزن","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ».","صحيح البخاري (6369)، وصحيح مسلم (2706).","","h",1,""],
[83,7,"دعاء ذي النون","«لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ».","القرآن الكريم، الأنبياء (87)، وورد فضله في جامع الترمذي (3505).","","q",1,""],
[87,7,"دعاء المصيبة","«إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا».","صحيح مسلم (918).","","h",1,""],
[89,7,"طلب العفو والعافية","«اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ».","سنن أبي داود (5074)، والترمذي (3551).","","h",1,""],
[91,8,"دعاء لزيارة المريض","«لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللهُ».","صحيح البخاري (5656).","","h",1,""],
[9,1,"الاستعاذة قبل القراءة","«أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ».","القرآن الكريم، النحل (98).","","q",1,""],
[13,1,"الرفع من الركوع","«سَمِعَ اللهُ لِمَنْ حَمِدَهُ».","صحيح البخاري (789)، وصحيح مسلم (392).","","h",1,""],
[21,1,"الجلوس بين السجدتين (المطوّل)","«اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي».","جامع الترمذي (284)، وابن ماجه (898).","","h",1,""],
[54,3,"تحية الإسلام","«السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ».","القرآن الكريم، النساء (86).","","q",1,""],
[56,4,"إذا نسي التسمية","«بِسْمِ اللهِ أَوَّلَهُ وَآخِرَهُ».","سنن أبي داود (3767)، والترمذي (1858).","","h",1,"f"],
[69,5,"النزول في مكان","«أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ».","صحيح مسلم (2708).","","h",1,""],
[70,5,"توديع المسافر","«أَسْتَوْدِعُ اللهَ دِينَكَ، وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ».","سنن أبي داود (2600)، وجامع الترمذي (3443).","","h",1,""],
[73,5,"الرجوع من السفر","«آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ».","صحيح البخاري (1797)، وصحيح مسلم (1342).","","h",1,""],
[74,6,"عند نزول المطر","«صَيِّبًا نَافِعًا».","صحيح البخاري (1032).","","h",1,""],
[75,6,"بعد نزول المطر","«مُطِرْنَا بِفَضْلِ اللهِ وَرَحْمَتِهِ».","صحيح البخاري (846)، وصحيح مسلم (71).","","h",1,""],
[79,6,"رؤية الهلال","«اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللهُ».","جامع الترمذي (3451).","حسّنه الترمذي، وضعّفه بعض أهل الحديث؛ لذا يُذكر مع التنبيه إلى الخلاف.","h",1,""],
[90,7,"طلب الهداية والتقوى","«اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى، وَالتُّقَى، وَالْعَفَافَ، وَالْغِنَى».","صحيح مسلم (2721).","","h",1,""],
[98,9,"الدعاء للمتزوج","«بَارَكَ اللهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ».","جامع الترمذي (1091)، وقال: حسن صحيح.","","h",1,""],
[99,9,"العطاس والتشميت","العاطس: «الْحَمْدُ لِلَّهِ». السامع: «يَرْحَمُكَ اللهُ». العاطس: «يَهْدِيكُمُ اللهُ وَيُصْلِحُ بَالَكُمْ».","صحيح البخاري (6224).","","h",1,""],
[102,9,"دعاء كفارة المجلس","«سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ».","سنن أبي داود (4859)، والترمذي (3433).","","h",1,""],
[103,9,"الدعاء لمن صنع معروفًا","«جَزَاكَ اللهُ خَيْرًا».","جامع الترمذي (2035).","","h",1,""],
[106,10,"زيادة العلم","﴿رَبِّ زِدْنِي عِلْمًا﴾.","القرآن الكريم، طه (114).","","q",1,""],
[108,10,"العلم النافع والرزق الطيب","«اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا».","سنن ابن ماجه (925)، وصححه عدد من أهل الحديث.","","h",1,""],
[118,10,"دعاء ليلة القدر","«اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي».","جامع الترمذي (3513)، وابن ماجه (3850).","","h",1,""],
[119,11,"تلقين المحتضر","«لَا إِلَهَ إِلَّا اللهُ». يُلقّن برفق دون إلحاح أو إزعاج.","صحيح مسلم (916).","","h",1,""],
[121,11,"الدعاء للميت","«اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ وَاعْفُ عَنْهُ».","صحيح مسلم (963).","","h",1,""],
[123,11,"زيارة القبور","«السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللهُ بِكُمْ لَاحِقُونَ، نَسْأَلُ اللهَ لَنَا وَلَكُمُ الْعَافِيَةَ».","صحيح مسلم (975).","","h",1,""],
[124,12,"من رأى ما يكره في منامه","ينفث عن يساره ثلاث مرات، ويستعيذ بالله من الشيطان ومن شر ما رأى، ويتحول عن جنبه، ولا يخبر أحدًا بما رأى، ويقوم فيصلي إن أراد.","صحيح مسلم (2261–2262).","","h",1,""],
[126,13,"صيغة الاستغفار","«أَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ».","صحيح البخاري (6307)، وصحيح مسلم (2702).","","h",1,""],
[127,13,"سيد الاستغفار","«اللَّهُمَّ أَنْتَ رَبِّي، لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ».","صحيح البخاري (6306).","","h",1,""],
[128,14,"التسبيح","«سُبْحَانَ اللهِ وَبِحَمْدِهِ».","صحيح البخاري (6405)، وصحيح مسلم (2691).","","h",100,""],
[132,14,"الحوقلة","«لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ».","صحيح البخاري (6384)، وصحيح مسلم (2704).","","h",1,""],
[133,14,"الباقيات الصالحات","«سُبْحَانَ اللهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ».","صحيح مسلم (2137).","","h",1,""],
[134,15,"الاستعاذة من الشيطان","«أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ».","القرآن الكريم، النحل (98).","","q",1,""],
[136,15,"دعاء التحصين","«أُعِيذُكُمَا بِكَلِمَاتِ اللهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ».","صحيح البخاري (3371).","","h",1,""],
[141,15,"الاستعاذة من فتنة الدجال","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ».","صحيح مسلم (588).","","h",1,""],
[143,16,"دعاء طلب الذرية","﴿رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنْتَ خَيْرُ الْوَارِثِينَ﴾.","القرآن الكريم، الأنبياء (89).","","q",1,""],
[144,16,"دعاء صلاح الذرية والأسرة","﴿رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾.","القرآن الكريم، الفرقان (74).","","q",1,""],
[149,17,"دعاء قضاء الدين","«اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ».","جامع الترمذي (3563).","","h",1,""],
[150,17,"الغنى عن الناس","«اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى».","صحيح مسلم (2721).","","h",1,""],
[153,18,"الحمد الكثير","«الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ».","صحيح البخاري (5458).","","h",1,""],
[155,18,"الحمد عند النعمة","«الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ».","سنن ابن ماجه (3803).","","h",1,""],
[157,18,"دعاء الاعتراف والتوبة","﴿رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ﴾.","القرآن الكريم، الأعراف (23).","","q",1,""],
[11,1,"ذكر آخر في الركوع","«سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي».","صحيح البخاري (817)، وصحيح مسلم (484).","","h",1,""],
[12,1,"ذكر آخر في الركوع","«سُبُّوحٌ قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ».","صحيح مسلم (487).","","h",1,""],
[15,1,"بعد الاعتدال (صيغة أطول)","«رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ».","صحيح البخاري (799).","","h",1,""],
[22,1,"التشهد","«التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ».","صحيح البخاري (831)، وصحيح مسلم (402).","","h",1,""],
[23,1,"الصلاة الإبراهيمية","«اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","صحيح البخاري (3370)، وصحيح مسلم (406).","","h",1,""],
[25,1,"دعاء طلب المغفرة قبل السلام","«اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ».","صحيح البخاري (834)، وصحيح مسلم (2705).","","h",1,""],
[26,1,"دعاء الإعانة على العبادة","«اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ».","سنن أبي داود (1522)، والنسائي (1303).","","h",1,""],
[34,1,"دعاء سجود التلاوة","«سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، بِحَوْلِهِ وَقُوَّتِهِ، فَتَبَارَكَ اللهُ أَحْسَنُ الْخَالِقِينَ».","سنن أبي داود (1414)، والترمذي (580).","","h",1,""],
[39,1,"الدعاء للمسلمين أحياءً وأمواتًا","«اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا».","سنن أبي داود (3201)، والترمذي (1024).","","h",1,""],
[45,2,"الصلاة على النبي ﷺ بعد الأذان","«اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ».","صحيح مسلم (384)، وفيه الأمر بالصلاة على النبي ﷺ بعد إجابة المؤذن.","","h",1,""],
[50,3,"عند لبس الثوب","«الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ».","سنن أبي داود (4023)، وجامع الترمذي (3458) بألفاظ متقاربة.","حسن في أصل الذكر، وفي بعض ألفاظ الثواب زيادة كلام فيها.","h",1,""],
[51,3,"عند لبس ثوب جديد","«اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ خَيْرَهُ وَخَيْرَ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ».","سنن أبي داود (4020).","","h",1,""],
[52,3,"تهنئة من لبس ثوبًا جديدًا","«تُبْلِي وَيُخْلِفُ اللهُ تَعَالَى».","سنن أبي داود (4020).","","h",1,""],
[53,3,"عند خلع الثياب","«بِسْمِ اللهِ». ورد في الحديث أن التسمية ستر بين أعين الجن وعورات بني آدم.","جامع الترمذي (606).","في ثبوت الحديث وتحسينه كلام بين أهل العلم.","h",1,""],
[58,4,"الحمد بعد الطعام بلفظ آخر","«الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ، غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا».","صحيح البخاري (5458).","","h",1,"f"],
[59,4,"الدعاء لصاحب الطعام","«اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ».","صحيح مسلم (2042).","","h",1,""],
[60,4,"دعاء لمن أطعمك","«اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي، وَاسْقِ مَنْ سَقَانِي».","صحيح مسلم (2055).","","h",1,""],
[63,4,"الدعاء للصائم","«أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ».","سنن أبي داود (3854).","","h",1,""],
[67,5,"عند الصعود والنزول","عند الصعود: «اللهُ أَكْبَرُ». عند النزول: «سُبْحَانَ اللهِ».","صحيح البخاري (2993).","","h",1,""],
[71,5,"دعاء المقيم للمسافر","«زَوَّدَكَ اللهُ التَّقْوَى، وَغَفَرَ ذَنْبَكَ، وَيَسَّرَ لَكَ الْخَيْرَ حَيْثُمَا كُنْتَ».","جامع الترمذي (3444).","","h",1,""],
[72,5,"دعاء الاستيداع","«أَسْتَوْدِعُكُمُ اللهَ الَّذِي لَا تَضِيعُ وَدَائِعُهُ».","ابن ماجه (2825)، وأحمد.","حسنه عدد من أهل العلم.","h",1,""],
[76,6,"عند كثرة المطر والخوف من الضرر","«اللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اللَّهُمَّ عَلَى الْآكَامِ وَالظِّرَابِ، وَبُطُونِ الْأَوْدِيَةِ، وَمَنَابِتِ الشَّجَرِ».","صحيح البخاري (1014)، وصحيح مسلم (897).","","h",1,""],
[77,6,"عند هبوب الرياح","«اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا فِيهَا، وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا فِيهَا، وَشَرِّ مَا أُرْسِلَتْ بِهِ».","صحيح مسلم (899).","","h",1,""],
[78,6,"عند سماع الرعد","«سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ».","الموطأ للإمام مالك، من قول عبد الله بن الزبير رضي الله عنهما.","أثر ثابت عن ابن الزبير، وليس حديثًا مرفوعًا ثبت عن النبي ﷺ أنه قاله عند سماع الرعد.","a",1,""],
[80,6,"الاستسقاء","«اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا».","صحيح البخاري (1013)، وصحيح مسلم (897).","","h",1,""],
[82,7,"دعاء الكرب","«لَا إِلَهَ إِلَّا اللهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللهُ رَبُّ السَّمَاوَاتِ، وَرَبُّ الْأَرْضِ، وَرَبُّ الْعَرْشِ الْكَرِيمِ».","صحيح البخاري (6346)، وصحيح مسلم (2730).","","h",1,""],
[85,7,"عند الغضب","«أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ».","صحيح البخاري (3282)، وصحيح مسلم (2610)، في قصة الرجل الذي اشتد غضبه.","","h",1,""],
[86,7,"الاستعاذة من الشر","«اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ، وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ».","سنن أبي داود (1537).","","h",1,""],
[88,7,"دعاء التوكل","«حَسْبِيَ اللهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ».","القرآن الكريم، التوبة (129).","","q",1,""],
[92,8,"دعاء المريض لنفسه","«أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا».","صحيح البخاري (5675)، وصحيح مسلم (2191).","","h",1,""],
[93,8,"الرقية","«بِسْمِ اللهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللهُ يَشْفِيكَ، بِسْمِ اللهِ أَرْقِيكَ».","صحيح مسلم (2186).","","h",1,""],
[97,9,"التعزية","«إِنَّ لِلَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ».","صحيح البخاري (1284)، وصحيح مسلم (923).","","h",1,""],
[110,10,"دعاء نوح عليه السلام","﴿أَنِّي مَغْلُوبٌ فَانْتَصِرْ﴾.","القرآن الكريم، القمر (10).","","q",1,""],
[112,10,"دعاء موسى عليه السلام","﴿رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾.","القرآن الكريم، القصص (24).","","q",1,""],
[115,10,"دعاء زكريا عليه السلام","﴿رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ﴾.","القرآن الكريم، آل عمران (38).","","q",1,""],
[122,11,"بعد دفن الميت","«اسْتَغْفِرُوا لِأَخِيكُمْ، وَسَلُوا لَهُ التَّثْبِيتَ، فَإِنَّهُ الْآنَ يُسْأَلُ».","سنن أبي داود (3221).","","h",1,""],
[129,14,"التحميد","«الْحَمْدُ لِلَّهِ».","صحيح مسلم (223).","","h",1,""],
[130,14,"التهليل","«لَا إِلَهَ إِلَّا اللهُ».","صحيح البخاري (6403)، وصحيح مسلم (2691).","","h",1,""],
[131,14,"التكبير","«اللهُ أَكْبَرُ».","صحيح مسلم (2137).","","h",1,""],
[7,1,"الاستفتاح الثاني","«اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ».","صحيح البخاري (744)، وصحيح مسلم (598).","","h",1,""],
[8,1,"الاستفتاح الثالث","«وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ».","صحيح مسلم (771).","","h",1,""],
[16,1,"بعد الرفع من الركوع (صيغة أخرى)","«مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أَهْلَ الثَّنَاءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ».","صحيح مسلم (477).","","h",1,""],
[19,1,"دعاء آخر في السجود","«اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللهُ أَحْسَنُ الْخَالِقِينَ».","صحيح مسلم (771).","","h",1,""],
[24,1,"الاستعاذة من أربع قبل السلام","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ».","صحيح البخاري (1377)، وصحيح مسلم (588).","","h",1,""],
[30,1,"التهليل مع الحوقلة بعد الصلاة","«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ، لَا إِلَهَ إِلَّا اللهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ».","صحيح مسلم (594).","","h",1,"p"],
[32,1,"آية الكرسي","﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾.","القرآن الكريم، البقرة (255)؛ وقراءتها بعد الصلاة: النسائي في السنن الكبرى.","صححه عدد من أهل العلم.","q",1,"p"],
[33,1,"المعوذات والإخلاص بعد الصلاة","سورة الإخلاص، سورة الفلق، سورة الناس. تُقرأ بعد الصلوات المفروضة، وقد ورد تخصيصها بعد الفجر والمغرب بثلاث مرات في بعض الروايات، وأما بقية الصلوات فتُقرأ مرة.","سنن أبي داود (1523)، والنسائي (1336).","","h",1,"p"],
[35,1,"دعاء آخر لسجود التلاوة","«اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْرًا، وَضَعْ عَنِّي بِهَا وِزْرًا، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْرًا، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ».","جامع الترمذي (579).","","h",1,""],
[36,1,"دعاء قنوت الوتر","«اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، إِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، إِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، وَلَا يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ».","أبو داود (1425)، والترمذي (464).","","h",1,""],
[37,1,"دعاء الاستخارة","«اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ.<br>اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي، ثُمَّ بَارِكْ لِي فِيهِ.<br>وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ».<br>وعند قوله «هذا الأمر» يسمّي حاجته.","صحيح البخاري (1166).","","h",1,""],
[38,1,"الدعاء للميت في صلاة الجنازة","«اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَعَذَابِ النَّارِ».","صحيح مسلم (963).","","h",1,""],
[40,2,"دعاء الخروج إلى الصلاة وطلب النور","«اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَفِي سَمْعِي نُورًا، وَفِي بَصَرِي نُورًا، وَمِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَمِنْ بَيْنِ يَدَيَّ نُورًا، وَمِنْ خَلْفِي نُورًا، وَاجْعَلْ فِي نَفْسِي نُورًا، وَأَعْظِمْ لِي نُورًا».","صحيح مسلم (763)، وأصل دعاء النور وارد في الصحيحين بألفاظ متعددة.","","h",1,""],
[44,2,"ترديد الأذان","يقول السامع مثل ما يقول المؤذن، إلا عند: «حَيَّ عَلَى الصَّلَاةِ، حَيَّ عَلَى الْفَلَاحِ» فيقول: «لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ».","صحيح البخاري (611)، وصحيح مسلم (383).","","h",1,""],
[47,3,"ذكر الله عند دخول المنزل","يُشرع ذكر الله عند دخول المنزل وإلقاء السلام على أهله. قال رسول الله ﷺ: «إذا دخل الرجل بيته فذكر الله عند دخوله وعند طعامه قال الشيطان: لا مبيت لكم ولا عشاء».","صحيح مسلم (2018).","","h",1,"o"],
[49,3,"الذكر عند دخول السوق","«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لَا يَمُوتُ، بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ».","جامع الترمذي (3428)، وابن ماجه (2235).","الرواية التي تربط هذا الذكر بثواب عظيم جدًا عند دخول السوق ضعّفها عدد من أهل العلم؛ فلا يُعتقد ثواب خاص لهذا النص، ويجوز ذكر الله في السوق عمومًا.","h",1,""],
[1001,3,"الاستئذان","«السَّلَامُ عَلَيْكُمْ، أَأَدْخُلُ؟». وإذا لم يؤذن له بالرجوع فليرجع.","صحيح البخاري (6245)، وصحيح مسلم (2153)، والقرآن الكريم، سورة النور (27–28).","","h",1,""],
[64,4,"فضل تفطير الصائم","قال ﷺ: «من فطّر صائمًا كان له مثل أجره، غير أنه لا ينقص من أجر الصائم شيء».","جامع الترمذي (807)، وقال: حسن صحيح.","","h",1,""],
[65,5,"دعاء الركوب","﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ﴾.","القرآن الكريم، الزخرف (13–14).","","q",1,""],
[66,5,"دعاء السفر","«اللهُ أَكْبَرُ، اللهُ أَكْبَرُ، اللهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ.<br>اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا، وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ».","صحيح مسلم (1342).","","h",1,"o"],
[1002,6,"عند رؤية ما يعجب الإنسان","«مَا شَاءَ اللهُ، لَا قُوَّةَ إِلَّا بِاللهِ».","القرآن الكريم، الكهف (39).","","q",1,""],
[84,7,"الدعاء عند الشدة","«اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي».","مسند أحمد (3712).","صححه عدد من أهل العلم.","h",1,""],
[1003,8,"عند رؤية مبتلى","«الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا».","جامع الترمذي (3431).","في ثبوت الحديث كلام بين أهل العلم؛ ولذلك لا يُقدّم على أنه حديث صحيح متفق عليه، ويُراعى ألا يسمعه المبتلى فيتأذى.","h",1,""],
[1004,9,"تهنئة المولود","«بَارَكَ اللهُ لَكُمْ فِيهِ، وَأَنْبَتَهُ نَبَاتًا حَسَنًا، وَجَعَلَهُ مِنَ الصَّالِحِينَ».","","هذا دعاء جائز، وليس نصًا نبويًا ثابتًا؛ فلم يثبت حديث مرفوع صحيح بصيغة تهنئة محددة للمولود.","d",1,""],
[107,10,"طلب الفهم والتيسير","﴿رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي ۝ يَفْقَهُوا قَوْلِي﴾.","القرآن الكريم، طه (25–28).","","q",1,""],
[111,10,"دعاء إبراهيم عليه السلام","﴿رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ﴾.","القرآن الكريم، إبراهيم (40).","","q",1,""],
[113,10,"دعاء أيوب عليه السلام","﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ﴾.","القرآن الكريم، الأنبياء (83).","","q",1,""],
[116,10,"دعاء سليمان عليه السلام","﴿رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ﴾.","القرآن الكريم، النمل (19).","","q",1,""],
[138,15,"الاستعاذة من فتنة المحيا والممات","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ».","صحيح البخاري (1377)، وصحيح مسلم (588).","","h",1,""],
[139,15,"الاستعاذة من عذاب القبر","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ».","صحيح مسلم (588).","","h",1,""],
[140,15,"الاستعاذة من النار","«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ النَّارِ». ومن الدعاء الجامع: ﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الْآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ﴾.","القرآن الكريم، البقرة (201).","","h",1,""],
[156,18,"الحمد في جميع الأحوال","«الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ».","ورد في روايات السنن والآثار.","يجوز للمسلم أن يحمد الله بها، ولا يلزم تخصيصها بوقت معين.","d",1,""]
];
const $=s=>document.querySelector(s),V=$("#v");
const st=(k,d)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}};
const sv=(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}};
let fav=st("fav",[]),mine=st("mine",[]),done=st("done",{}),tk=st("tk",true),tab="h",ch=null,q="",cnt=0,goal=33,ft="",fb="";
const day=()=>new Date().toISOString().slice(0,10);
const strip=s=>s.replace(/[\u064B-\u065F\u0670]/g,"");
const norm=s=>strip(s).replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const tx=s=>tk?s:strip(s);
const BK=[["البخاري","البخاري"],["مسلم","مسلم"],["أبو داود","أبي داود|أبو داود"],["الترمذي","الترمذي"],["ابن ماجه","ابن ماجه"],["النسائي","النسائي"],["أحمد","أحمد"],["الموطأ","الموطأ"]];
const TY=[["","الكل"],["q","قرآن"],["h","حديث"],["a","أثر"],["d","دعاء جائز"]];
const flt=x=>(!ft||x[6]==ft)&&(!fb||new RegExp(BK.find(b=>b[0]==fb)[1]).test(x[4]));
const fbar=()=>`<div class="chips" aria-label="النوع">${TY.map(t=>`<button data-ft="${t[0]}" class="${ft==t[0]?"on":""}">${t[1]}</button>`).join("")}</div><div class="chips" aria-label="الكتاب"><button data-fb="" class="${fb==""?"on":""}">كل الكتب</button>${BK.map(b=>`<button data-fb="${b[0]}" class="${fb==b[0]?"on":""}">${b[0]}</button>`).join("")}</div>`;
const has=(a,id)=>a.includes(id);
const tog=(a,id)=>has(a,id)?a.filter(x=>x!==id):[...a,id];
function streak(){let n=0,d=new Date();if(!(done[d.toISOString().slice(0,10)]||[]).length)d.setDate(d.getDate()-1);while((done[d.toISOString().slice(0,10)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function card(x){const[id,c,t,txt,src,gr,ty,n]=x,dn=has(done[day()]||[],id);
return `<article class="card"><h3>${t}<span class="badge">${({q:"قرآن",a:"أثر",d:"دعاء جائز"})[ty]||"حديث"}</span>${n>1?`<span class="badge">${n} مرات</span>`:""}</h3><div class="txt">${tx(txt)}</div>${src?`<p class="src">المصدر: ${src}</p>`:""}${gr?`<p class="src">الدرجة: ${gr}</p>`:""}<div class="acts"><button data-a="fav" data-i="${id}" class="${has(fav,id)?"on":""}">المفضلة</button><button data-a="mine" data-i="${id}" class="${has(mine,id)?"on":""}">قائمتي</button><button data-a="done" data-i="${id}" class="${dn?"on":""}">تم اليوم</button><button data-a="copy" data-i="${id}">نسخ</button><button data-a="share" data-i="${id}">مشاركة</button></div></article>`}
const get=id=>D.find(x=>x[0]==id);
function view(){
let h="";
if(tab=="h"){
h=`<input type="search" id="q" placeholder="ابحث في الأذكار" value="${q}" aria-label="بحث">`+fbar();
if(q){const r=D.filter(x=>norm(x[2]+x[3]+x[4]).includes(norm(q))&&flt(x));h+=r.length?r.map(card).join(""):`<p class="src">لا نتائج. جرّب كلمة أقصر.</p>`}
else if(ch!==null){h+=`<button data-a="back">‹ كل الأبواب</button><h2>${C[ch]}</h2>`+D.filter(x=>x[1]==ch&&flt(x)).map(card).join("")}
else if(ft||fb){const r=D.filter(flt);h+=`<p class="src">${r.length} ذكر</p>`+(r.length?r.map(card).join(""):`<p class="src">لا أذكار بهذا الفلتر.</p>`)}
else h+=`<div class="grid">`+C.map((n,i)=>{const k=D.filter(x=>x[1]==i).length;return `<button class="ch" data-c="${i}" ${k?"":"disabled"}><span>${n}</span><small>${k||"قريبًا"}</small></button>`}).join("")+`</div>`}
if(tab=="d"){const t=new Date(),dd=D[Math.floor((t-new Date(t.getFullYear(),0,0))/864e5)%D.length],hr=t.getHours();
const tag=["p"].concat(hr>=5&&hr<9?["w"]:[],(hr>=6&&hr<9)||(hr>=12&&hr<15)||(hr>=18&&hr<21)?["f"]:["o"]);
const sg=D.filter(x=>tag.includes(x[8]));
h=`<div class="card"><h3>أيام متتالية بذكر الله</h3><div class="big" style="font-size:48px;margin:6px 0">${streak()}</div><p class="src">اضغط «تم اليوم» على أي ذكر لتُحسب لك أيام الاستمرار.</p></div><h2>ذكر اليوم</h2>${card(dd)}<h2>مقترح الآن</h2>${sg.map(card).join("")}`}
if(tab=="s"){h=`<div class="big" id="n">${cnt}</div><button class="tap" id="tp">اضغط للتسبيح</button><div class="row">الهدف: ${[33,100].map(g=>`<button data-g="${g}" class="${goal==g?"on":""}">${g}</button>`).join("")}<button id="rs">من جديد</button></div>`}
if(tab=="f"){const f=fav.map(get).filter(Boolean),m=mine.map(get).filter(Boolean);
h=`<h2>قائمتي اليومية</h2>${m.length?m.map(card).join(""):`<p class="src">أضف أذكارًا بزر «قائمتي» لتجدها هنا.</p>`}<h2>المفضلة</h2>${f.length?f.map(card).join(""):`<p class="src">اضغط «المفضلة» على أي ذكر لحفظه هنا.</p>`}`}
V.innerHTML=h}
document.addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;ch=null;q="";ft="";fb="";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));return view()}
if(b.dataset.c){ch=+b.dataset.c;return view()}
if(b.dataset.ft!==undefined){ft=b.dataset.ft;return view()}
if(b.dataset.fb!==undefined){fb=b.dataset.fb;return view()}
if(b.dataset.g){goal=+b.dataset.g;cnt=0;return view()}
if(b.id=="rs"){cnt=0;return view()}
if(b.id=="tp"){cnt++;$("#n").textContent=cnt;if(cnt%goal==0&&navigator.vibrate)navigator.vibrate(200);else if(navigator.vibrate)navigator.vibrate(15);return}
const a=b.dataset.a,id=+b.dataset.i;
if(a=="back"){ch=null;return view()}
if(a=="fav"){fav=tog(fav,id);sv("fav",fav);return view()}
if(a=="mine"){mine=tog(mine,id);sv("mine",mine);return view()}
if(a=="done"){const d=day();done[d]=tog(done[d]||[],id);sv("done",done);return view()}
if(a=="copy"||a=="share"){const x=get(id),s=`${x[2]}\n${tx(x[3])}\nالمصدر: ${x[4]}`;
if(a=="share"&&navigator.share)navigator.share({text:s}).catch(()=>{});
else if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{b.textContent="تم النسخ"}).catch(()=>{})}
});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;const p=e.target.selectionStart;view();const i=$("#q");i.focus();i.setSelectionRange(p,p)}});
$("#bs").onclick=()=>$("#set").classList.toggle("hid");
$("#fs").oninput=e=>{document.documentElement.style.setProperty("--fs",e.target.value+"px");sv("fs",e.target.value)};
$("#tk").onclick=e=>{tk=!tk;sv("tk",tk);e.target.textContent="التشكيل: "+(tk?"يظهر":"مخفي");e.target.classList.toggle("on",tk);view()};
$("#bt").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark";sv("th",r.dataset.theme)};
const th=st("th",null);if(th)document.documentElement.dataset.theme=th;
const f0=st("fs",26);$("#fs").value=f0;document.documentElement.style.setProperty("--fs",f0+"px");
$("#tk").textContent="التشكيل: "+(tk?"يظهر":"مخفي");$("#tk").classList.toggle("on",tk);
view();
</script>
</body>
</html>
